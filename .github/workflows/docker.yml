name: Docker MLOps

on:
  workflow_call:

permissions:
  contents: read

jobs:
  docker-test:
    name: Build, tests et evaluation ML
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      MIN_ACCURACY: ${{ vars.MIN_ACCURACY || '0.90' }}

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construire l'image avec cache
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: iris-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Demarrer le conteneur
        run: |
          docker run -d \
            --name iris-api-test \
            -p 8000:8000 \
            iris-api:ci

      - name: Attendre que l'API reponde
        run: |
          python - <<'PY'
          import time
          import urllib.request

          for attempt in range(30):
              try:
                  with urllib.request.urlopen(
                      "http://localhost:8000/health",
                      timeout=2,
                  ) as response:
                      if response.status == 200:
                          print("API disponible")
                          break
              except Exception:
                  time.sleep(2)
          else:
              raise SystemExit("API indisponible")
          PY

      - name: Tester une prediction
        run: |
          python - <<'PY'
          import json
          import urllib.request

          payload = {
              "sepal_length": 5.1,
              "sepal_width": 3.5,
              "petal_length": 1.4,
              "petal_width": 0.2,
          }

          request = urllib.request.Request(
              "http://localhost:8000/predict",
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )

          with urllib.request.urlopen(request) as response:
              result = json.load(response)

          assert result["species"] == "setosa", result
          print("Prediction valide :", result)
          PY

      - name: Evaluer les performances du modele
        id: evaluation
        run: |
          docker exec \
            -e MIN_ACCURACY="$MIN_ACCURACY" \
            iris-api-test \
            python -m src.evaluate

      - name: Recuperer les metriques
        if: ${{ !cancelled() }}
        run: |
          mkdir -p reports

          if docker cp \
            iris-api-test:/app/reports/metrics.json \
            reports/metrics.json; then
            echo "Rapport recupere"
          else
            echo "::warning::Rapport indisponible"
          fi

      - name: Publier les metriques
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: model-metrics
          path: reports/metrics.json
          if-no-files-found: warn
          retention-days: 14

      - name: Verifier la presence du rapport
        run: test -s reports/metrics.json

      - name: Afficher le resume des metriques
        if: ${{ !cancelled() }}
        run: |
          if [ -f reports/metrics.json ]; then
            python - <<'PY'
          import json
          import os

          with open("reports/metrics.json", encoding="utf-8") as file:
              metrics = json.load(file)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## Performances du modele Iris\n\n")
              summary.write("| Metrique | Valeur |\n")
              summary.write("|---|---:|\n")

              for name, value in metrics.items():
                  summary.write(f"| {name} | {value:.2%} |\n")
          PY
          fi

      - name: Afficher les logs en cas d'echec
        if: ${{ failure() }}
        run: docker logs iris-api-test || true

      - name: Arreter le conteneur
        if: ${{ !cancelled() }}
        run: docker rm -f iris-api-test || true

      - name: Connexion a GHCR
        if: >-
          ${{ success()
              && github.event_name == 'push'
              && github.ref == 'refs/heads/main' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generer les tags Docker
        id: meta
        if: >-
          ${{ success()
              && github.event_name == 'push'
              && github.ref == 'refs/heads/main' }}
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Publier l'image validee
        if: >-
          ${{ success()
              && github.event_name == 'push'
              && github.ref == 'refs/heads/main' }}
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue

            docker tag iris-api:ci "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
