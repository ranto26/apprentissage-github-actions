name: CI Python Avancee

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_NAME: learn-ci-cd

jobs:
  lint:
    name: Ruff - Qualite du code
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Ruff
        run: python -m pip install "ruff>=0.9,<1"

      - name: Verifier le code
        run: python -m ruff check .

      - name: Verifier le formatage
        run: python -m ruff format --check .

  tests:
    name: Tests Python ${{ matrix.python-version }} avec un seuil de ${{ matrix.coverage-threshold}}%

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        coverage-threshold: [80, 90, 95]

    uses: ./.github/workflows/reusable-python-tests.yml

    with:
      python-version: ${{ matrix.python-version }}
      coverage-threshold: ${{ matrix.coverage-threshold }}

  evaluation:
    name: Evaluation Data Science
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Calculer la metrique
        run: python scripts/evaluate.py

      - name: Conserver la metrique
        uses: actions/upload-artifact@v4
        with:
          name: metriques-datascience
          path: metrics.txt

  validation:
    name: Validation CI
    needs: [lint, tests, evaluation]
    runs-on: ubuntu-latest

    steps:
      - name: Afficher le projet
        run: 'echo run "Projet valide : $PROJECT_NAME"'

      - name: Confirmer la reussite
        run: echo "Lint et tests reussis"
