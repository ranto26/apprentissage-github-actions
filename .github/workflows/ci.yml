name: CI - Data Science Python

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Qualité du code
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Ruff
        run: python -m pip install "ruff>=0.9,<1"

      - name: Exécuter Ruff
        run: python -m ruff check .

  tests:
    name: Tests unitaires
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Exécuter pytest
        run: python -m pytest -v

  information:
    name: Information
    runs-on: ubuntu-latest
    needs:
      - lint
      - tests

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Afficher la version de Python
        run: python3 --version

      - name: Afficher la branche
        env:
          BRANCHE: ${{ github.head_ref }}
        run: echo "$BRANCHE"