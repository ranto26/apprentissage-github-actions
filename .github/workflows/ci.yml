name: CI Python et MLOps

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_NAME: learn-ci-cd

jobs:
  lint:
    name: Ruff - Qualite du code
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Ruff
        run: python -m pip install "ruff>=0.9,<1"

      - name: Verifier le code
        run: python -m ruff check .

      - name: Verifier le formatage
        run: python -m ruff format --check .

  tests:
    name: Tests Python ${{ matrix.python-version }}

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    uses: ./.github/workflows/reusable-python-tests.yml

    with:
      python-version: ${{ matrix.python-version }}

  docker:
    name: Docker et validation MLOps
    needs: [lint, tests]

    permissions:
      contents: read
      packages: write

    uses: ./.github/workflows/docker.yml

  validation:
    name: Validation globale CI/CD
    needs: [lint, tests, docker]
    runs-on: ubuntu-latest

    steps:
      - name: Afficher le projet
        run: |
          echo "Projet valide : $PROJECT_NAME"

      - name: Confirmer la reussite
        run: |
          echo "Qualite du code validee"
          echo "Tests Python reussis"
          echo "Image Docker validee"
          echo "Performances du modele validees"
