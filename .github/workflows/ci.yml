name: CI Python Professionnelle

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Ruff - Qualité du code
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Ruff
        run: python -m pip install "ruff>=0.9,<1"

      - name: Vérifier le lint
        run: python -m ruff check .

      - name: Vérifier le formatage
        run: python -m ruff format --check .

  tests:
    name: Tests Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Récuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Exécuter les tests
        run: python -m pytest

  validation:
    name: Validation CI
    needs: [lint, tests]
    runs-on: ubuntu-latest

    steps:
      - name: Confirmation
        run: echo "Toutes les vérifications ont réussi"
