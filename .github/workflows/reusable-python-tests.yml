name: Tests Python reutilisables

on:
  workflow_call:
    inputs:
      python-version:
        description: Version de Python
        required: true
        type: string
      
      coverage-threshold:
        description: Seuil minimal de couverture
        required: false
        type: number
        default: 80

permissions:
  contents: read

jobs:
  tests:
    name: pytest Python ${{ inputs.python-version }}
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python avec cache pip
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Entrainer le modele pour les tests
        run: python -m src.train

      - name: Executer les tests et mesurer la couverture
        run: python -m pytest --cov-report=html

      - name: Conserver le rapport de couverture
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ inputs.python-version }}
          path: htmlcov/
          if-no-files-found: warn
          retention-days: 7
